<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Account — ZE Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#0b1020; --ink-soft:#131a30; --ink-line:rgba(255,255,255,.09);
        --card:#ffffff;
        --blue:#2563eb; --blue-deep:#17419e;
        --lime:#c3ff4d;
        --on-dark:#eef1fb; --on-dark-dim:#9aa4c4;
        --on-light:#0f1430; --on-light-dim:#5b6280;
        --radius:16px;
        --shadow:0 24px 60px -24px rgba(11,16,32,.45);
        --display:'Space Grotesk', sans-serif; --body:'Manrope', sans-serif;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{font-family:var(--body); background:var(--ink); color:var(--on-dark); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;}
    h1,h2{font-family:var(--display); letter-spacing:-0.01em;}
    a{color:inherit;}
    .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:28px;}
    .brand span{width:32px; height:32px; border-radius:8px; background:var(--blue); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:13px;}
    .shell{width:100%; max-width:400px;}
    .head{text-align:center; margin-bottom:26px;}
    .head h1{font-size:26px; margin-bottom:8px;}
    .head p{color:var(--on-dark-dim); font-size:14px;}

    .form-card{background:var(--card); color:var(--on-light); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow);}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--on-light-dim);}
    .form-group input{
        width:100%; padding:11px 13px; border-radius:9px; border:1px solid #dfe2ee; font-size:14px;
        font-family:var(--body); background:#fbfbfe;
    }
    .form-group input:focus{outline:none; border-color:var(--blue);}
    .btn{width:100%; padding:13px; border:none; border-radius:999px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--body);}
    .btn-primary{background:var(--blue); color:#fff;}
    .btn-primary:hover{background:var(--blue-deep);}
    .btn-primary:disabled{opacity:.6; cursor:default;}
    .msg{border-radius:9px; padding:11px 13px; font-size:13px; margin-bottom:16px; display:none;}
    .msg.error{background:#fef2f2; color:#b91c1c; border:1px solid #fecaca;}
    .msg.success{background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0;}
    .hint{text-align:center; font-size:13px; color:var(--on-dark-dim); margin-top:20px;}
    .hint a{color:var(--lime); font-weight:600;}
    .next-note{margin-top:14px; font-size:12px; color:var(--on-light-dim); text-align:center; line-height:1.5;}
</style>
</head>
<body>

    <div class="brand"><a href="index.html" style="display:flex; align-items:center; gap:10px;"><span>ZE</span> ZE Payroll</a></div>

    <div class="shell">
        <div class="head">
            <h1>Create your account</h1>
            <p>Set up your login now — you'll pick a plan the moment you sign in.</p>
        </div>

        <div class="form-card">
            <div class="msg error" id="errMsg"></div>
            <div class="msg success" id="okMsg"></div>

            <form id="regForm">
                <div class="form-group">
                    <label for="businessName">Business Name</label>
                    <input type="text" id="businessName" placeholder="e.g. ZE Fiber Internet Services" required autocomplete="organization">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="you@business.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" id="regBtn">Create Account</button>
            </form>
            <div class="next-note">After this, sign in and you'll be asked to pick a plan (a free 5-day trial or a paid plan) before your dashboard unlocks.</div>
        </div>

        <div class="hint">Already have an account? <a href="app.html">Sign in</a></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const supabaseClient = (window.supabase && typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.includes('YOUR-PROJECT'))
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        const errMsg = document.getElementById('errMsg');
        const okMsg = document.getElementById('okMsg');

        function showError(text) {
            errMsg.textContent = text;
            errMsg.style.display = 'block';
            okMsg.style.display = 'none';
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!supabaseClient) { showError('Not connected to Supabase.'); return; }

            const businessName = document.getElementById('businessName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            errMsg.style.display = 'none';
            okMsg.style.display = 'none';

            if (password !== confirm) { showError('Passwords do not match.'); return; }

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account…';

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { business_name: businessName } }
            });

            btn.disabled = false;
            btn.textContent = 'Create Account';

            if (error) { showError(error.message || 'Could not create your account.'); return; }

            // If email confirmation is OFF in Supabase Auth settings, signUp
            // returns a live session immediately -> go straight to the app,
            // where the plan picker takes over automatically.
            if (data.session) {
                window.location.href = 'app.html';
                return;
            }

            okMsg.style.display = 'block';
            okMsg.innerHTML = `Account created! Check <b>${email}</b> for a confirmation link, then sign in to pick your plan.`;
            document.getElementById('regForm').reset();
        });

        (async function init() {
            if (supabaseClient) {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) { window.location.href = 'app.html'; }
            }
        })();
    </script>
</body>
</html>
