<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Payslip Portal</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --success: #10b981;
        --danger: #ef4444;
        --gray-50: #f8fafc;
        --gray-200: #e2e8f0;
        --gray-400: #94a3b8;
        --gray-600: #475569;
        --gray-800: #1e293b;
        --gray-900: #0f172a;
        --radius: 12px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, var(--gray-900) 0%, var(--gray-800) 100%);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        text-align: center;
    }
    .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
    }
    h1 { font-size: 20px; color: var(--gray-900); margin-bottom: 4px; }
    .sub { color: var(--gray-600); font-size: 14px; margin-bottom: 24px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gray-400); transition: all .15s; }
    .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
    .pin-dot.shake { animation: shake .4s; border-color: var(--danger); }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .key {
        aspect-ratio: 1;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 600; color: var(--gray-900);
        background: var(--gray-50); border-radius: 14px; cursor: pointer;
        user-select: none;
    }
    .key:active { background: var(--gray-200); }
    .key.action { font-size: 14px; font-weight: 500; color: var(--gray-600); }
    .status-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 16px; }
    .spinner {
        width: 32px; height: 32px; margin: 0 auto 16px;
        border: 3px solid var(--gray-200); border-top-color: var(--primary);
        border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-msg { padding: 20px 0; }
    .result-icon {
        width: 56px; height: 56px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; margin: 0 auto 16px; color: white;
    }
    .result-icon.error { background: var(--danger); }
    .result-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
    .result-sub { font-size: 14px; color: var(--gray-600); margin-bottom: 20px; }
    .btn {
        display: inline-block; padding: 12px 20px; border-radius: 10px;
        background: var(--primary); color: white; font-size: 14px; font-weight: 600;
        border: none; cursor: pointer; text-decoration: none;
    }
    .btn:active { background: var(--primary-dark); }
    .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }

    .payslip-list { text-align: left; }
    .payslip-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 4px; border-bottom: 1px solid var(--gray-200); cursor: pointer;
    }
    .payslip-row:last-child { border-bottom: none; }
    .payslip-row:active { background: var(--gray-50); }
    .payslip-row .period { font-size: 14px; font-weight: 600; color: var(--gray-900); }
    .payslip-row .payout { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
    .payslip-row .net { font-size: 15px; font-weight: 700; color: var(--primary); }
    .empty-msg { color: var(--gray-600); font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<div class="card" id="card">
    <div id="loadingView" class="center-msg">
        <div class="spinner"></div>
        <div class="sub">Loading...</div>
    </div>
</div>

<script>
// ============================================
// Employee-facing payslip portal - view/download past payslips
// using the SAME PIN as the attendance kiosk (scan.html).
// URL format: payslip.html?emp=EMP-2026-001&ws=<workspace-uuid>
// Nothing here is trusted client-side: get_employee_payslips()
// re-checks the PIN server-side (bcrypt) before returning anything,
// exactly like record_attendance_punch does for scan.html.
// ============================================

const params = new URLSearchParams(window.location.search);
const employeeId = params.get('emp');
const workspaceId = params.get('ws');

let supabaseClient = null;
if (window.supabase && typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.includes('YOUR-PROJECT')) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let pin = '';
let submitting = false;
let employeeName = '';
let payslips = [];

function initials(name) {
    return name.split(' ').filter(Boolean).map(p => p[0]).join('').slice(0, 2).toUpperCase();
}

function renderError(title, sub) {
    document.getElementById('card').innerHTML = `
        <div class="result-icon error">!</div>
        <div class="result-title">${title}</div>
        <div class="result-sub">${sub}</div>
    `;
}

function renderPinPad() {
    document.getElementById('card').innerHTML = `
        <div class="avatar">${initials(employeeName)}</div>
        <h1>Hi, ${employeeName}!</h1>
        <div class="sub">Enter your 4-digit PIN to view your payslips</div>
        <div class="pin-dots" id="pinDots">
            ${[0, 1, 2, 3].map(() => '<div class="pin-dot"></div>').join('')}
        </div>
        <div class="keypad" id="keypad">
            ${[1,2,3,4,5,6,7,8,9].map(n => `<div class="key" data-key="${n}">${n}</div>`).join('')}
            <div class="key action" data-key="clear">Clear</div>
            <div class="key" data-key="0">0</div>
            <div class="key action" data-key="back">&larr;</div>
        </div>
        <div class="status-msg" id="statusMsg"></div>
    `;
    document.getElementById('keypad').addEventListener('click', onKeyPress);
    updateDots();
}

function updateDots(shake) {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((dot, i) => {
        dot.classList.toggle('filled', i < pin.length);
        dot.classList.toggle('shake', !!shake);
    });
    if (shake) setTimeout(() => dots.forEach(d => d.classList.remove('shake')), 400);
}

function onKeyPress(e) {
    const key = e.target.closest('.key')?.dataset.key;
    if (!key || submitting) return;

    if (key === 'clear') { pin = ''; setStatus(''); updateDots(); return; }
    if (key === 'back') { pin = pin.slice(0, -1); updateDots(); return; }
    if (pin.length >= 4) return;
    pin += key;
    updateDots();
    if (pin.length === 4) submitPin();
}

function setStatus(msg) {
    const el = document.getElementById('statusMsg');
    if (el) el.textContent = msg;
}

async function submitPin() {
    submitting = true;
    setStatus('Checking...');

    const { data, error } = await supabaseClient.rpc('get_employee_payslips', {
        p_workspace_id: workspaceId,
        p_employee_id: employeeId,
        p_pin: pin
    });

    submitting = false;

    if (error) {
        console.error('get_employee_payslips RPC error:', error);
        pin = '';
        updateDots(true);
        setStatus('Error: ' + (error.message || error.code || 'unknown - please screenshot this and send to your admin.'));
        return;
    }

    if (!data.success) {
        pin = '';
        updateDots(true);
        setStatus(data.message || 'Incorrect PIN.');
        return;
    }

    employeeName = data.employee_name;
    payslips = data.payslips || [];
    renderPayslipList();
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    const date = new Date(dateStr + 'T00:00:00');
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatNumber(num) {
    return (num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderPayslipList() {
    const rows = payslips.map((p, i) => {
        const s = p.snapshot || {};
        const monthName = new Date(p.period_start + 'T00:00:00').toLocaleString('default', { month: 'long', year: 'numeric' });
        return `
            <div class="payslip-row" onclick="viewPayslip(${i})">
                <div>
                    <div class="period">${monthName}</div>
                    <div class="payout">${formatDate(p.period_start)} - ${formatDate(p.period_end)}${p.payout_date ? ' &middot; Paid ' + formatDate(p.payout_date) : ''}</div>
                </div>
                <div class="net">&#8369;${formatNumber(s.netPay)}</div>
            </div>
        `;
    }).join('');

    document.getElementById('card').innerHTML = `
        <div class="avatar">${initials(employeeName)}</div>
        <h1>${employeeName}</h1>
        <div class="sub">${payslips.length} payslip${payslips.length === 1 ? '' : 's'} on file</div>
        <div class="payslip-list">
            ${payslips.length > 0 ? rows : '<div class="empty-msg">No payslips have been processed yet. Check back after the next payroll run.</div>'}
        </div>
    `;
}

function paymentMethodLabel(method) {
    switch (method) {
        case 'bank': return 'Bank Transfer';
        case 'gcash': return 'GCash';
        case 'maya': return 'Maya';
        default: return 'Cash';
    }
}

// Renders the same layout as the admin's printed payslip
// (generatePayslip() in app.js), but sourced entirely from the
// stored snapshot rather than a live computation - this page never
// has access to the admin's own app.js/localStorage state.
function buildPayslipHTML(p) {
    const s = p.snapshot || {};
    const company = s.company || {};
    const monthName = new Date(p.period_start + 'T00:00:00').toLocaleString('default', { month: 'long', year: 'numeric' });
    const showStatutory = s.enableStatutoryDeductions !== false && !s.hideStatutoryOnPayslip;
    const pd = s.paymentDetails || {};

    return `
        <div style="padding: 20px; max-width: 600px; margin: 0 auto; font-family: Arial, sans-serif;">
            <div style="text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 24px;">${company.name || 'Company Name'}</h2>
                <p style="margin: 4px 0; font-size: 13px;">${company.address || ''}</p>
                <p style="margin: 4px 0; font-size: 12px;">TIN: ${company.tin || '000-000-000-000'}</p>
                <hr style="margin: 16px 0; border-color: #ccc;">
                <h3 style="margin: 0; font-size: 18px;">PAYSLIP</h3>
                <p style="margin: 4px 0; font-size: 13px;">Pay Period: ${formatDate(p.period_start)} - ${formatDate(p.period_end)}</p>
                ${p.payout_date ? `<p style="margin: 4px 0; font-size: 13px;">Payout Date: ${formatDate(p.payout_date)}</p>` : ''}
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; font-size: 13px;">
                <div><strong>Employee:</strong> ${employeeName}</div>
                <div><strong>Employee ID:</strong> ${employeeId}</div>
                <div><strong>Pay Period:</strong> ${monthName}</div>
            </div>

            <div style="margin-bottom: 20px; padding: 10px 12px; background: #f8f9fa; border-radius: 4px; font-size: 12.5px;">
                <strong>Payment Method:</strong> ${paymentMethodLabel(pd.method)}
                ${pd.method && pd.method !== 'cash' ? `
                <br><strong>Account Name:</strong> ${pd.accountName || '-'}
                <br><strong>Account / Mobile Number:</strong> ${pd.accountNumber || '-'}
                ${pd.note ? `<br><strong>Note:</strong> ${pd.note}` : ''}
                ` : ''}
            </div>

            <div style="margin-bottom: 20px;">
                <h4 style="border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 12px;">EARNINGS</h4>
                <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                    <tr style="background: #f0f0f0;">
                        <th style="text-align: left; padding: 6px; border: 1px solid #ddd;">Description</th>
                        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Hours/Days</th>
                        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Rate</th>
                        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Amount</th>
                    </tr>
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Basic Pay (${s.fullDaysWorked || 0} full ${s.fullDaysWorked === 1 ? 'day' : 'days'})</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">${s.fullDaysWorked || 0}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.dailyRate)}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber((s.dailyRate || 0) * (s.fullDaysWorked || 0))}</td>
                    </tr>
                    ${s.halfDaysWorked > 0 ? `
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Half-Day Pay (${s.halfDaysWorked} half ${s.halfDaysWorked === 1 ? 'day' : 'days'})</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">${s.halfDaysWorked}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber((s.dailyRate || 0) * 0.5)}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber((s.dailyRate || 0) * 0.5 * s.halfDaysWorked)}</td>
                    </tr>
                    ` : ''}
                    ${s.hourlyOverrideHours > 0 ? `
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Hourly-Rate Pay (undertime override)</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">${s.hourlyOverrideHours.toFixed(2)}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.hourlyRate)}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.hourlyOverridePay)}</td>
                    </tr>
                    ` : ''}
                    ${s.otHours > 0 ? `
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Overtime Pay</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">${s.otHours.toFixed(2)}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.otRate || ((s.hourlyRate || 0) * 1.25))}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.otPay)}</td>
                    </tr>
                    ` : ''}
                    <tr style="font-weight: bold; background: #f9f9f9;">
                        <td colspan="3" style="text-align: right; padding: 8px; border: 1px solid #ddd;">GROSS PAY</td>
                        <td style="text-align: right; padding: 8px; border: 1px solid #ddd;">&#8369;${formatNumber(s.grossPay)}</td>
                    </tr>
                </table>
            </div>

            <div style="margin-bottom: 20px;">
                <h4 style="border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 12px;">DEDUCTIONS</h4>
                <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                    <tr style="background: #f0f0f0;">
                        <th style="text-align: left; padding: 6px; border: 1px solid #ddd;">Description</th>
                        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Amount</th>
                    </tr>
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Late Deduction (${s.lateMinutes || 0} min)</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.lateDeduction)}</td>
                    </tr>
                    ${showStatutory ? `
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">SSS Contribution</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.sssDeduction)}</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">PhilHealth Contribution</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.philhealthDeduction)}</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">Pag-IBIG Contribution</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(s.pagibigDeduction)}</td>
                    </tr>
                    ` : ''}
                    ${(s.otherDeductions || []).map(d => `
                    <tr>
                        <td style="padding: 6px; border: 1px solid #ddd;">${d.label}</td>
                        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;">&#8369;${formatNumber(parseFloat(d.amount) || 0)}</td>
                    </tr>
                    `).join('')}
                    <tr style="font-weight: bold; background: #f9f9f9;">
                        <td style="padding: 8px; border: 1px solid #ddd;">TOTAL DEDUCTIONS</td>
                        <td style="text-align: right; padding: 8px; border: 1px solid #ddd;">&#8369;${formatNumber(s.totalDeductions)}</td>
                    </tr>
                </table>
            </div>

            <div style="border: 2px solid #333; border-radius: 8px; padding: 20px; text-align: center; background: #f8f9fa;">
                <p style="margin: 0 0 8px; font-size: 14px; color: #666;">NET PAY</p>
                <p style="margin: 0; font-size: 28px; font-weight: bold; color: #2563eb;">&#8369;${formatNumber(s.netPay)}</p>
            </div>

            <div style="margin-top: 20px; text-align: center; font-size: 10px; color: #999;">
                This is a computer-generated payslip, retrieved from the employee payslip portal.
            </div>
        </div>
    `;
}

function viewPayslip(index) {
    const p = payslips[index];
    if (!p) return;
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Payslip - ${employeeName}</title>
            <style>
                @media print { @page { margin: 15mm; } body { margin: 0; } }
                body { margin: 20px; }
            </style>
        </head>
        <body>${buildPayslipHTML(p)}</body>
        </html>
    `);
    printWindow.document.close();
}

async function init() {
    if (!supabaseClient) {
        renderError('Not Configured', 'This portal has not been connected to the payroll system yet. Please contact your administrator.');
        return;
    }
    if (!employeeId || !workspaceId) {
        renderError('Link Not Recognized', 'Please use the payslip portal link your admin sent you, or contact your administrator.');
        return;
    }

    const { data, error } = await supabaseClient
        .from('employees_kiosk_view')
        .select('first_name, last_name, status')
        .eq('workspace_id', workspaceId)
        .eq('id', employeeId)
        .maybeSingle();

    if (error || !data) {
        renderError('Employee Not Found', 'This link is not recognized. Please contact your administrator.');
        return;
    }
    if (data.status !== 'active') {
        renderError('Account Inactive', 'This employee account is not currently active. Please contact your administrator.');
        return;
    }

    employeeName = `${data.first_name} ${data.last_name}`;
    renderPinPad();
}

init();
</script>
</body>
</html>
